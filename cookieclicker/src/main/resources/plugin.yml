name: CookieClicker
version: '${project.version}'
main: com.gerhartstudios.cookieclicker.CookieClickerPlugin
api-version: '1.21'
author: GerhartStudios
description: Ein moderner Cookie-Clicker fuer deinen Minecraft-Server.
softdepend: [Vault, PlaceholderAPI]

commands:
  cc:
    description: Hauptbefehl von CookieClicker.
    usage: /cc <bind|unbind|reload|reset|setcookie|addcookie|setlevel>
    aliases: [cookieclicker]

permissions:
  cookieclicker.use:
    description: Erlaubt das Benutzen des Cookie-Clicker-Blocks.
    default: true
  cookieclicker.admin:
    description: Erlaubt Admin-Befehle (bind, unbind, reload, reset, setcookie, addcookie, setlevel).
    default: op
